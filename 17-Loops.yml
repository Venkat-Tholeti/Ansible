---
 - name: Loops
   hosts: frontend
   become: yes
   tasks:
      - name: Using loop concept package install
        package:
           name: "{{ item }}"
           state: present
        debug:
           msg: "{{ item}} installed successfully"
        when: state = present
        loop:
         - nginx
         - httpd

 - name: Loops
   hosts: local
   connection: local
   tasks:
     - name: Loops concept testing with names
       debug:
         msg: "Hello {{ item }}"
       loop:
        - Suresh
        - Ramesh
        - Nani