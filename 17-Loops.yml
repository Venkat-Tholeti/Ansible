---
 - name: Loops
   hosts: frontend
   become: yes
   tasks:
      - name: Using loop concept package install
        package:
           name: "{{ item }}"
           state: present
        loop:
         - nginx
         - httpd
         - mysql

 - name: Loops
   hosts: local
   connection: local
   tasks:
     - name: Loops concept testing with names
       debug:
         msg: "Hello {{ item }}"
       loop:
        - Suresh
        - Ramesh
        - Nani

  # to install and remove some packages

 - name: Loops
   hosts: frontend
   become: yes
   tasks:
     - name: Loops concept 
       package:
         name: "{{ item.name }}"
         state: "{{ item.state }}"
       loop:
        - { name: 'nginx', state: 'present' }
        - { name: 'mysql', state: 'absent' }
        - { name: 'zip', state: 'absent' }