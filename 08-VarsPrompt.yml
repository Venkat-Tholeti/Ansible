---

 - name: Variables from prompt # Read in shell = Prompt in ansible
   hosts: local
   connection: local
   vars_prompt:
     - name: USERNAME
       prompt: Please enter your username
       private: true # just like -s in read

     - name: PASSWORD
       prompt: Please enter your password
       private: true 

   tasks:
     - name: printing User info
       debug: 
         msg: "Hello Username is {{ USERNAME }}, password is {{ PASSWORD }}"